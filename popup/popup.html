<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <input
      id="filter"
      class="filter"
      type="search"
      placeholder="Find a workspace"
      aria-label="Find a workspace"
    />

    <ul id="list" class="list" role="listbox" aria-label="Workspaces"></ul>

    <p id="empty" class="empty" hidden>No workspace matches that.</p>

    <div class="footer">
      <button id="new" class="new">New workspace</button>
      <button id="add-sep" class="new secondary">Add separator</button>
    </div>

    <p class="meta">
      <span id="hint" class="hint"></span>
      <span class="links">
        <a href="#" id="backup">backup</a>
        <a href="#" id="diag">diagnostics</a>
      </span>
    </p>

    <p id="diagnote" class="diagnote" hidden>
      Page addresses are shortened to their site and titles are left out.
      <label><input type="checkbox" id="diagfull" /> include full addresses</label>
    </p>
    <textarea id="diagout" class="diagout" hidden readonly aria-label="Diagnostics"></textarea>
    <p id="error" class="error" hidden role="alert"></p>

    <script src="../shared/palette.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
